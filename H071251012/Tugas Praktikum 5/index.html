
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloudberry Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F0F8FF] min-h-screen p-5 md:p-8 font-['Nunito']">

    <main class="max-w-5xl mx-auto">
        <!-- HEADER -->
        <header class="mb-8">
            <h1 class="font-['Fredoka'] text-3xl md:text-4xl font-semibold text-[#5486AD]">
                Cloudberry Tasks ☁️
            </h1>

            <p class="text-slate-500 mt-2">
                Daftar tugas anggota tim.
            </p>
        </header>

        <!-- KONTEN UTAMA -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- DAFTAR ANGGOTA -->
            <section class="bg-white rounded-2xl p-5 shadow-sm">
                <h2 class="font-['Fredoka'] text-2xl text-[#5486AD] mb-2">
                    Anggota Tim ࣪ ִֶָ☾.
                </h2>

                <p class="text-sm text-slate-400 mb-4">
                    Pilih anggota untuk melihat tugasnya.
                </p>

                <p id="statusAnggota" class="text-sm text-sky-600 mb-3">
                    Memuat anggota...
                </p>

                <div id="daftarAnggota"
                    class="space-y-2 max-h-96 overflow-y-auto pr-2">
                </div>

            </section>

            <!-- DAFTAR TUGAS -->
            <section class="md:col-span-2 space-y-5">
                <div class="bg-white rounded-2xl p-5 shadow-sm">
                    <h2 id="judulTugas"
                        class="font-['Fredoka'] text-2xl text-[#5486AD] mb-3">
                        Pilih Anggota.ᐟ
                    </h2>
                    <p id="statusTugas" class="text-sm text-sky-600 mb-3"></p>

                    <!-- PROGRES -->
                    <div class="bg-[#F0F8FF] rounded-xl p-4 mb-5">
                        <p class="text-sm text-sky-600 font-bold">
                            PROGRES TUGAS
                        </p>
                        <p id="progres" class="text-lg text-[#5486AD] font-bold mt-1"></p>
                    </div>

                    <!-- PENCARIAN -->
                    <h3 class="font-['Fredoka'] text-xl text-[#5486AD] mb-3">
                        Daftar Tugas
                    </h3>
                    <input
                        type="text"
                        id="pencarian"
                        placeholder="Cari tugas..."
                        class="border border-[#D6E6F2] rounded-[10px] outline-none focus:border-[#8CBCE0] w-full p-3 mb-4"
                    >
                    <p id="pesanPencarian" class="text-sm text-slate-400 mb-3"></p>
                    <div id="daftarTugas" class="space-y-3"></div>
                </div>

                <!-- FORM TAMBAH TUGAS -->
                <div class="bg-[#DFF3FF] rounded-2xl p-5">
                    <h3 class="font-['Fredoka'] text-2xl text-[#5486AD] mb-2">
                        Tambah Tugas
                    </h3>
                    <p class="text-sm text-slate-500 mb-4">
                        Tambahkan tugas baru ke daftar.
                    </p>
                    <form id="formTugas">

                        <label for="judulBaru"
                            class="block font-bold text-[#5486AD] mb-2">
                            Judul tugas
                        </label>

                        <input
                            type="text"
                            id="judulBaru"
                            placeholder="Tulis tugas barumu..."
                            class="border border-[#D6E6F2] rounded-[10px] outline-none focus:border-[#8CBCE0] w-full p-3 mb-3"
                        >

                        <p id="pesanForm" class="text-sm text-red-500 mb-3"></p>

                        <button
                            type="submit"
                            id="tombolSimpan"
                            class="font-['Fredoka'] bg-[#D9EEFF] hover:bg-[#C5E5FA] text-[#3979A8] rounded-xl px-5 py-3 font-semibold"
                        >
                            Simpan
                        </button>

                    </form>

                    <p id="notifikasi" class="text-sm font-bold text-[#3979A8] mt-4"></p>
                </div>
            </section>
        </div>

        <!-- FOOTER -->
        <footer class="text-center mt-8 text-sm text-slate-400">
            Cloudberry Tasks ♡
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
